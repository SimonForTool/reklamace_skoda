<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reklamace {{ cislo }}</title>
<style>
  :root {
    --blue:    #1F4E79;
    --blue2:   #2E75B6;
    --blue3:   #BDD7EE;
    --gray:    #f4f5f7;
    --border:  #c8cdd4;
    --text:    #1a1a2e;
    --green:   #27ae60;
    --orange:  #e67e22;
    --red:     #e74c3c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Arial, sans-serif;
         font-size: 13px; color: var(--text); background: #eef2f7; }

  header {
    background: var(--blue); color: #fff; padding: 0 24px;
    display: flex; align-items: center; gap: 14px; height: 54px;
    position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,.25);
  }
  header h1 { font-size: 16px; font-weight: 700; margin: 0; white-space: nowrap; }
  header a.back { color: rgba(255,255,255,.7); text-decoration: none; font-size: 12px; }
  header a.back:hover { color: #fff; }
  header .spacer { flex: 1; }
  .save-status { font-size: 11px; color: rgba(255,255,255,.7); min-width: 110px; text-align: right; }

  .tabs {
    display: flex; gap: 2px; padding: 10px 24px 0;
    background: var(--blue); overflow-x: auto;
  }
  .tab {
    padding: 7px 14px; border-radius: 8px 8px 0 0; cursor: pointer;
    font-size: 12px; font-weight: 600; color: rgba(255,255,255,.65);
    background: rgba(255,255,255,.1); border: none; white-space: nowrap;
    transition: background .15s; display: inline-flex; align-items: center; gap: 6px;
  }
  .tab:hover { background: rgba(255,255,255,.2); color: #fff; }
  .tab.active { background: #eef2f7; color: var(--blue); }
  .tab .dot { width: 8px; height: 8px; border-radius: 50%; background: #cfd6dd; }
  .tab .dot.hotovo { background: var(--green); }
  .tab .dot.probiha { background: var(--orange); }

  main { padding: 20px 24px; max-width: 900px; margin: 0 auto; }
  .panel { display: none; }
  .panel.active { display: block; }

  .card {
    background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.1);
    overflow: hidden; margin-bottom: 20px;
  }
  .card-header {
    background: var(--blue); color: #fff; padding: 10px 16px;
    font-weight: 700; font-size: 13px; display: flex; align-items: center; gap: 8px;
  }
  .card-body { padding: 16px; }

  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
  .field label { display: block; font-size: 11.5px; color: #555; margin-bottom: 4px; font-weight: 600; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 7px 9px; border: 1px solid var(--border);
    border-radius: 6px; font-size: 13px; font-family: inherit;
  }
  .field textarea { resize: vertical; min-height: 70px; }

  .stav-select.nezahájeno { color: #7f8c9a; font-weight: 700; }
  .stav-select.probíhá    { color: var(--orange); font-weight: 700; }
  .stav-select.hotovo     { color: var(--green); font-weight: 700; }

  .priloha-list { list-style: none; margin: 10px 0 0; padding: 0; }
  .priloha-list li {
    display: flex; align-items: center; gap: 8px; padding: 6px 10px;
    background: var(--gray); border-radius: 6px; margin-bottom: 6px; font-size: 12.5px;
  }
  .priloha-list a { color: var(--blue2); text-decoration: none; flex: 1; }
  .priloha-list a:hover { text-decoration: underline; }
  .priloha-list button {
    border: none; background: none; color: var(--red); cursor: pointer; font-size: 13px;
  }
  .upload-row { margin-top: 12px; display: flex; align-items: center; gap: 10px; }

  .toast {
    position: fixed; bottom: 20px; right: 20px; background: #27ae60; color: #fff;
    padding: 10px 18px; border-radius: 8px; font-size: 13px; font-weight: 600;
    box-shadow: 0 4px 12px rgba(0,0,0,.2); opacity: 0; transition: opacity .3s;
    pointer-events: none; z-index: 999;
  }
  .toast.show { opacity: 1; }
  .toast.error { background: #e74c3c; }
</style>
</head>
<body>

<header>
  <h1>🛠️ Reklamace {{ cislo }} <span style="opacity:.6;font-weight:600">({{ brand_label }})</span></h1>
  <a class="back" href="/{{ brand }}">← Přehled reklamací</a>
  <div class="spacer"></div>
  <span class="save-status" id="saveStatus"></span>
</header>

<div class="tabs" id="tabBar">
  <button class="tab active" data-panel="hlavicka" onclick="switchTab(this,'hlavicka')">📄 Základní údaje</button>
  {% for f in faze_defs %}
  <button class="tab" data-panel="{{ f.key }}" onclick="switchTab(this,'{{ f.key }}')">
    <span class="dot" id="dot-{{ f.key }}"></span> {{ f.label }}
  </button>
  {% endfor %}
</div>

<main>

  <!-- ══ Základní údaje ══ -->
  <div class="panel active" id="panel-hlavicka">
    <div class="card">
      <div class="card-header">📄 Základní údaje reklamace</div>
      <div class="card-body">
        <div class="form-grid">
          <div class="field">
            <label>Interní číslo</label>
            <input type="text" value="{{ cislo }}" disabled>
          </div>
          <div class="field">
            <label>Servisní partner</label>
            <input id="hServisniPartner" type="text" onchange="changeHeader('servisni_partner', this.value)">
          </div>
          <div class="field">
            <label>Kontaktní osoba</label>
            <input id="hKontaktniOsoba" type="text" onchange="changeHeader('kontaktni_osoba', this.value)">
          </div>
          <div class="field">
            <label>Datum přijetí reklamace</label>
            <input id="hDatumPrijeti" type="date" onchange="changeHeader('datum_prijeti', this.value)">
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ══ Fáze ══ -->
  {% for f in faze_defs %}
  <div class="panel" id="panel-{{ f.key }}">
    <div class="card">
      <div class="card-header">🔧 {{ f.label }}</div>
      <div class="card-body">
        <div class="form-grid">
          {% if f.key == 'ostatni' %}
          <div class="field" style="grid-column: 1 / -1">
            <label>Název dodavatele</label>
            <input id="f-{{ f.key }}-dodavatel" type="text" placeholder="např. Midtronics, Deutronic…"
                   onchange="changeFaze('{{ f.key }}', 'dodavatel', this.value)">
          </div>
          {% endif %}
          <div class="field">
            <label>Stav</label>
            <select id="f-{{ f.key }}-stav" class="stav-select" onchange="changeFaze('{{ f.key }}', 'stav', this.value)">
              <option value="nezahájeno">Nezahájeno</option>
              <option value="probíhá">Probíhá</option>
              <option value="hotovo">Hotovo</option>
            </select>
          </div>
          <div class="field">
            <label>Datum</label>
            <input id="f-{{ f.key }}-datum" type="date" onchange="changeFaze('{{ f.key }}', 'datum', this.value)">
          </div>
          <div class="field">
            <label>Odpovědná osoba</label>
            <input id="f-{{ f.key }}-odpovedna_osoba" type="text" onchange="changeFaze('{{ f.key }}', 'odpovedna_osoba', this.value)">
          </div>
          <div class="field" style="grid-column: 1 / -1">
            <label>Poznámka</label>
            <textarea id="f-{{ f.key }}-poznamka" onchange="changeFaze('{{ f.key }}', 'poznamka', this.value)"></textarea>
          </div>
        </div>

        <div class="field" style="margin-top:14px">
          <label>Přílohy</label>
          <ul class="priloha-list" id="prilohy-{{ f.key }}"></ul>
          <div class="upload-row">
            <input type="file" id="upload-{{ f.key }}">
            <button class="tab" style="border-radius:6px;color:#fff;background:var(--blue2)"
                    onclick="uploadPriloha('{{ f.key }}')">⬆️ Nahrát přílohu</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  {% endfor %}

</main>

<div class="toast" id="toast"></div>

<script>
const CISLO = {{ cislo | tojson }};
const FAZE_KEYS = {{ faze_defs | map(attribute='key') | list | tojson }};
let DATA = null;

async function init() {
  const resp = await fetch(`/api/reklamace/${CISLO}`);
  DATA = await resp.json();
  render();
}

function render() {
  document.getElementById("hServisniPartner").value = DATA.servisni_partner || "";
  document.getElementById("hKontaktniOsoba").value = DATA.kontaktni_osoba || "";
  document.getElementById("hDatumPrijeti").value = DATA.datum_prijeti || "";

  for (const key of FAZE_KEYS) {
    const f = DATA.faze[key];
    document.getElementById(`f-${key}-stav`).value = f.stav;
    document.getElementById(`f-${key}-stav`).className = "stav-select " + f.stav;
    document.getElementById(`f-${key}-datum`).value = f.datum || "";
    document.getElementById(`f-${key}-odpovedna_osoba`).value = f.odpovedna_osoba || "";
    document.getElementById(`f-${key}-poznamka`).value = f.poznamka || "";
    if (key === "ostatni") {
      document.getElementById(`f-${key}-dodavatel`).value = f.dodavatel || "";
    }
    renderPrilohy(key, f.prilohy);
    const dot = document.getElementById(`dot-${key}`);
    dot.className = "dot" + (f.stav === "hotovo" ? " hotovo" : f.stav === "probíhá" ? " probiha" : "");
  }
}

function renderPrilohy(key, prilohy) {
  const ul = document.getElementById(`prilohy-${key}`);
  if (!prilohy.length) {
    ul.innerHTML = `<li style="color:#999">Zatím žádné přílohy.</li>`;
    return;
  }
  ul.innerHTML = prilohy.map(name => `
    <li>
      <a href="/api/reklamace/${CISLO}/${key}/priloha/${encodeURIComponent(name)}" target="_blank">📎 ${escapeHtml(name)}</a>
      <button onclick="deletePriloha('${key}', '${escapeJs(name)}')" title="Smazat">✕</button>
    </li>`).join("");
}

function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function escapeJs(s) { return (s || "").replace(/'/g, "\\'"); }

async function changeHeader(field, value) {
  setSaving();
  try {
    const resp = await fetch(`/api/reklamace/${CISLO}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ [field]: value }),
    });
    DATA = await resp.json();
    setSaved();
  } catch (e) {
    setError();
  }
}

async function changeFaze(key, field, value) {
  setSaving();
  try {
    const resp = await fetch(`/api/reklamace/${CISLO}/${key}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ [field]: value }),
    });
    DATA = await resp.json();
    render();
    setSaved();
  } catch (e) {
    setError();
  }
}

async function uploadPriloha(key) {
  const input = document.getElementById(`upload-${key}`);
  const file = input.files[0];
  if (!file) { showToast("Vyberte soubor.", true); return; }
  const fd = new FormData();
  fd.append("file", file);
  setSaving();
  try {
    const resp = await fetch(`/api/reklamace/${CISLO}/${key}/priloha`, { method: "POST", body: fd });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.message || "Chyba nahrávání.");
    DATA = data;
    input.value = "";
    render();
    setSaved();
  } catch (e) {
    setError();
    showToast(e.message, true);
  }
}

async function deletePriloha(key, filename) {
  if (!confirm(`Smazat přílohu "${filename}"?`)) return;
  setSaving();
  try {
    const resp = await fetch(`/api/reklamace/${CISLO}/${key}/priloha/${encodeURIComponent(filename)}`, { method: "DELETE" });
    DATA = await resp.json();
    render();
    setSaved();
  } catch (e) {
    setError();
  }
}

function setSaving() { document.getElementById("saveStatus").textContent = "Ukládám…"; }
function setSaved() {
  const st = document.getElementById("saveStatus");
  st.textContent = "✓ Uloženo";
  setTimeout(() => { st.textContent = ""; }, 2000);
}
function setError() { document.getElementById("saveStatus").textContent = "❌ Chyba uložení"; }

function switchTab(el, panel) {
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
  el.classList.add("active");
  document.getElementById(`panel-${panel}`).classList.add("active");
}

function showToast(msg, isError = false) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast show" + (isError ? " error" : "");
  setTimeout(() => { t.className = "toast"; }, 3000);
}

init();
</script>
</body>
</html>
