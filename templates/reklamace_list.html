<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reklamace {{ brand_label }}</title>
<style>
  :root {
    --blue:    #1F4E79;
    --blue2:   #2E75B6;
    --blue3:   #BDD7EE;
    --gray:    #f4f5f7;
    --border:  #c8cdd4;
    --text:    #1a1a2e;
    --green:   #27ae60;
    --orange:  #e67e22;
    --red:     #e74c3c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Arial, sans-serif;
         font-size: 13px; color: var(--text); background: #eef2f7; }

  header {
    background: var(--blue); color: #fff; padding: 0 24px;
    display: flex; align-items: center; gap: 14px; height: 54px;
    position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,.25);
  }
  header h1 { font-size: 16px; font-weight: 700; margin: 0; white-space: nowrap; }
  header a.home { color: rgba(255,255,255,.7); text-decoration: none; font-size: 12px; }
  header a.home:hover { color: #fff; }
  header .spacer { flex: 1; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 16px; border-radius: 6px; border: none;
    cursor: pointer; font-size: 12.5px; font-weight: 600;
    transition: opacity .15s; white-space: nowrap;
  }
  .btn:hover { opacity: .85; }
  .btn-new    { background: #27ae60; color: #fff; }
  .btn-export { background: #e67e22; color: #fff; }
  .btn-cancel { background: rgba(255,255,255,.15); color: #fff; }

  main { padding: 20px 24px; width: 100%; margin: 0; }

  .year-total { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  .stat-box {
    background: #fff; border: 1.5px solid var(--border); border-radius: 8px;
    padding: 10px 18px; min-width: 140px; text-align: center;
  }
  .stat-box .sv { font-size: 20px; font-weight: 800; color: var(--blue); }
  .stat-box .sl { font-size: 11px; color: #666; margin-top: 2px; }

  .card {
    background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.1);
    overflow: hidden; margin-bottom: 20px;
  }
  .card-header {
    background: var(--blue); color: #fff; padding: 10px 16px;
    font-weight: 700; font-size: 13px; display: flex; align-items: center; gap: 8px;
  }
  .card-body { padding: 16px; overflow-x: auto; }

  #newForm { display: none; }
  #newForm.show { display: block; }
  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
  .field label { display: block; font-size: 11.5px; color: #555; margin-bottom: 4px; font-weight: 600; }
  .field input {
    width: 100%; padding: 7px 9px; border: 1px solid var(--border);
    border-radius: 6px; font-size: 13px;
  }
  .form-actions { margin-top: 16px; display: flex; gap: 10px; }
  .form-error { color: var(--red); font-size: 12px; margin-top: 8px; display: none; }

  table.grid { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.grid th {
    background: var(--blue); color: #fff; padding: 8px 10px; text-align: left;
    font-size: 11px; white-space: nowrap;
  }
  table.grid td { padding: 8px 10px; border-bottom: 1px solid #eee; white-space: nowrap; }
  table.grid tr.row:hover td { background: #f7fafc; cursor: pointer; }
  table.grid td.num { text-align: right; }

  .badge {
    display: inline-block; padding: 3px 10px; border-radius: 12px;
    font-size: 11px; font-weight: 700; color: #fff;
  }
  .badge.nova        { background: #7f8c9a; }
  .badge.probiha     { background: var(--orange); }
  .badge.vyrizeno    { background: var(--green); }
  .badge.fakturovano { background: var(--blue2); }

  .btn-confirm { background: #8e44ad; color: #fff; }
  .settings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; align-items: end; }
  .settings-grid .readonly-val { font-size: 18px; font-weight: 800; color: var(--blue); padding: 7px 0; }

  .empty { padding: 30px; text-align: center; color: #888; }

  .toast {
    position: fixed; bottom: 20px; right: 20px; background: #27ae60; color: #fff;
    padding: 10px 18px; border-radius: 8px; font-size: 13px; font-weight: 600;
    box-shadow: 0 4px 12px rgba(0,0,0,.2); opacity: 0; transition: opacity .3s;
    pointer-events: none; z-index: 999;
  }
  .toast.show { opacity: 1; }
  .toast.error { background: #e74c3c; }
</style>
</head>
<body>

<header>
  <h1>🛠️ Reklamace {{ brand_label }}</h1>
  <a class="home" href="/">← Výběr značky</a>
  <div class="spacer"></div>
  <button class="btn btn-export" onclick="exportXlsx()">📊 Export VAT do Excelu</button>
  <button class="btn btn-confirm" onclick="potvrditFakturaci()">✅ Potvrdit fakturaci</button>
  <button class="btn btn-new" id="toggleNewBtn" onclick="toggleNewForm()">➕ Nová reklamace</button>
</header>

<main>

  <div class="card">
    <div class="card-header">💰 Nastavení fakturace</div>
    <div class="card-body">
      <div class="settings-grid">
        <div class="field">
          <label>Převod hodin (počáteční rozpočet)</label>
          <input id="nastaveniPrevod" type="number" step="0.1" onchange="changeNastaveni('prevod_hodin', this.value)">
        </div>
        <div class="field">
          <label>Nevyfakturováno (hodiny čekající na potvrzení)</label>
          <div class="readonly-val" id="nevyfakturovanoHodin">0 h</div>
        </div>
        <div class="field">
          <label>Zůstatek po potvrzení fakturace</label>
          <div class="readonly-val" id="zustatekPreview">0 h</div>
        </div>
      </div>
    </div>
  </div>

  <div class="card" id="newForm">
    <div class="card-header">➕ Nová reklamace</div>
    <div class="card-body">
      <div class="form-grid">
        <div class="field">
          <label>Servisní partner *</label>
          <input id="fServisniPartner" type="text" placeholder="Název servisního partnera">
        </div>
        <div class="field">
          <label>Kontaktní osoba</label>
          <input id="fKontaktniOsoba" type="text" placeholder="Jméno kontaktní osoby">
        </div>
        <div class="field">
          <label>Datum přijetí reklamace *</label>
          <input id="fDatumPrijeti" type="date">
        </div>
      </div>
      <div class="form-error" id="formError"></div>
      <div class="form-actions">
        <button class="btn btn-new" onclick="createReklamace()">✔️ Založit reklamaci</button>
        <button class="btn btn-cancel" style="background:#ccc;color:#333" onclick="toggleNewForm(false)">Zrušit</button>
      </div>
    </div>
  </div>

  <div class="year-total" id="stats"></div>

  <div class="card">
    <div class="card-header">📋 Přehled reklamací</div>
    <div class="card-body" id="listBody">
      <div class="empty">Načítám…</div>
    </div>
  </div>

</main>

<div class="toast" id="toast"></div>

<script>
const BRAND = {{ brand | tojson }};
const STAV_CLASS = { "nová": "nova", "probíhá": "probiha", "vyřízeno": "vyrizeno", "fakturováno": "fakturovano" };
let NASTAVENI = { prevod_hodin: 0 };

async function loadNastaveni() {
  const resp = await fetch(`/api/nastaveni?znacka=${BRAND}`);
  NASTAVENI = await resp.json();
  document.getElementById("nastaveniPrevod").value = NASTAVENI.prevod_hodin;
}

async function changeNastaveni(field, value) {
  const resp = await fetch("/api/nastaveni", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ znacka: BRAND, [field]: value }),
  });
  NASTAVENI = await resp.json();
  const nevyfakturovanoHodin = parseFloat(document.getElementById("nevyfakturovanoHodin").textContent) || 0;
  updateZustatekPreview(nevyfakturovanoHodin);
  showToast("Nastavení uloženo.");
}

function updateZustatekPreview(nevyfakturovanoHodin) {
  const zustatek = (NASTAVENI.prevod_hodin || 0) - nevyfakturovanoHodin;
  const el = document.getElementById("zustatekPreview");
  el.textContent = `${zustatek.toFixed(1)} h`;
  el.style.color = zustatek < 0 ? "#e74c3c" : "";
}

async function potvrditFakturaci() {
  if (!confirm(
    "Potvrdit fakturaci označí VŠECHNY aktuálně uzavřené (nefakturované) reklamace jako Fakturováno " +
    "a odečte jejich odpracované hodiny z převodu hodin (rozpočtu) pro příští fakturaci.\n\n" +
    "Proveďte to až PO stažení a odeslání exportu VAT do Excelu. Pokračovat?"
  )) return;
  try {
    const resp = await fetch("/api/reklamace/potvrdit-fakturaci", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ znacka: BRAND }),
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.message || "Chyba při potvrzování fakturace.");
    showToast(`Fakturováno ${data.pocet_reklamaci} reklamací (${data.celkem_hodin} h). Nový zůstatek: ${data.novy_zustatek} h.`);
    await loadNastaveni();
    await loadList();
  } catch (e) {
    showToast(e.message, true);
  }
}

function fmtDate(iso) {
  if (!iso) return "—";
  const [y, m, d] = iso.split("-");
  return `${d}.${m}.${y}`;
}

function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

async function loadList() {
  const resp = await fetch(`/api/reklamace/historie?znacka=${BRAND}`);
  const rows = await resp.json();
  renderStats(rows);
  render(rows);
}

function initials(name) {
  if (!name || !name.trim()) return "";
  return name.trim().split(/\s+/).map(p => p[0].toUpperCase()).join("");
}

function fmtKc(n) {
  return `${(n || 0).toLocaleString("cs-CZ")} Kč`;
}

function renderStats(rows) {
  const otevrene = rows.filter(r => r.stav === "nová" || r.stav === "probíhá").length;
  const uzavrene = rows.filter(r => r.stav === "vyřízeno" || r.stav === "fakturováno");
  const fakturovano = rows.filter(r => r.stav === "fakturováno").length;
  const celkemHodin = rows.reduce((s, r) => s + (r.celkem_hodin || 0), 0);
  const dobaUzavrenych = uzavrene.filter(r => r.doba_pracovnich_dni != null);
  const prumerDnu = dobaUzavrenych.length
    ? dobaUzavrenych.reduce((s, r) => s + r.doba_pracovnich_dni, 0) / dobaUzavrenych.length
    : null;
  const naklady = rows.reduce((s, r) => s + (r.naklady_celkem || 0), 0);
  const faktura = rows.reduce((s, r) => s + (r.faktura_celkem || 0), 0);
  const neuhrazeno = rows.reduce((s, r) => s + (r.faktura_neuhrazeno || 0), 0);
  const cerpaniHodin = rows.filter(r => r.stav === "vyřízeno").reduce((s, r) => s + (r.celkem_hodin || 0), 0);
  document.getElementById("stats").innerHTML = `
    <div class="stat-box"><div class="sv">${rows.length}</div><div class="sl">Celkem reklamací</div></div>
    <div class="stat-box"><div class="sv">${otevrene}</div><div class="sl">Otevřené / probíhající</div></div>
    <div class="stat-box"><div class="sv">${uzavrene.length}</div><div class="sl">Uzavřené (${fakturovano} fakturováno)</div></div>
    <div class="stat-box"><div class="sv">${celkemHodin.toFixed(1)} h</div><div class="sl">Odpracováno celkem</div></div>
    <div class="stat-box"><div class="sv" style="${cerpaniHodin > 0 ? 'color:#8e44ad' : ''}">${cerpaniHodin.toFixed(1)} h</div><div class="sl">Čerpání hodin (uzavřeno, čeká na fakturaci)</div></div>
    <div class="stat-box"><div class="sv">${prumerDnu != null ? prumerDnu.toFixed(1) : "—"}</div><div class="sl">Průměr prac. dnů / uzavřenou reklamaci</div></div>
    <div class="stat-box"><div class="sv">${fmtKc(naklady)}</div><div class="sl">Náklady ForTool celkem</div></div>
    <div class="stat-box"><div class="sv">${fmtKc(faktura)}</div><div class="sl">Vydaná faktura celkem bez DPH</div></div>
    <div class="stat-box"><div class="sv" style="${neuhrazeno > 0 ? 'color:#e67e22' : ''}">${fmtKc(neuhrazeno)}</div><div class="sl">Čeká na úhradu</div></div>`;

  document.getElementById("nevyfakturovanoHodin").textContent = `${cerpaniHodin.toFixed(1)} h`;
  updateZustatekPreview(cerpaniHodin);
}

function render(rows) {
  const body = document.getElementById("listBody");
  if (!rows.length) {
    body.innerHTML = `<div class="empty">Zatím žádné reklamace. Založte první tlačítkem "Nová reklamace".</div>`;
    return;
  }
  let html = `<table class="grid"><thead><tr>
    <th>Číslo</th><th>Servisní partner</th><th>Kontaktní osoba</th>
    <th>Datum přijetí</th><th>Datum ukončení</th><th>Stav</th><th>Doba trvání (prac. dny)</th>
    <th>Aktuální fáze</th><th>Odpovědná osoba</th><th>Celkem hodin</th>
    <th>Náklady ForTool</th><th>Faktura bez DPH</th><th>Úhrada</th><th>Poznámky</th>
  </tr></thead><tbody>`;
  for (const r of rows) {
    const inits = initials(r.odpovedna_osoba);
    const odpTd = inits
      ? `<span title="${escapeHtml(r.odpovedna_osoba)}" style="cursor:help;border-bottom:1px dotted #999">${inits}</span>`
      : "—";
    const naklady = r.naklady_celkem
      ? `${fmtKc(r.naklady_celkem)}${r.dopravci ? ` <span style="color:#888">(${escapeHtml(r.dopravci)})</span>` : ""}`
      : "—";
    const uhradaClass = r.uhrada_stav === "Uhrazeno" ? "vyrizeno"
      : (r.uhrada_stav === "Čeká na úhradu" || r.uhrada_stav === "Částečně uhrazeno") ? "probiha" : "";
    const poznamky = r.poznamky
      ? `<span title="${escapeHtml(r.poznamky)}" style="cursor:help;border-bottom:1px dotted #999">${escapeHtml(r.poznamky.slice(0, 30))}${r.poznamky.length > 30 ? "…" : ""}</span>`
      : "—";
    html += `<tr class="row" onclick="location.href='/${BRAND}/reklamace/${r.cislo}'">
      <td><strong>${r.cislo}</strong></td>
      <td>${escapeHtml(r.servisni_partner)}</td>
      <td>${escapeHtml(r.kontaktni_osoba || "—")}</td>
      <td>${fmtDate(r.datum_prijeti)}</td>
      <td>${fmtDate(r.uzavreno)}</td>
      <td><span class="badge ${STAV_CLASS[r.stav]}">${escapeHtml(r.stav_label)}</span></td>
      <td class="num">${r.doba_pracovnich_dni ?? "—"}</td>
      <td>${escapeHtml(r.aktualni_faze)}</td>
      <td>${odpTd}</td>
      <td class="num">${r.celkem_hodin} h</td>
      <td class="num">${naklady}</td>
      <td class="num">${r.faktura_celkem ? fmtKc(r.faktura_celkem) : "—"}</td>
      <td>${uhradaClass ? `<span class="badge ${uhradaClass}">${escapeHtml(r.uhrada_stav)}</span>` : "—"}</td>
      <td>${poznamky}</td>
    </tr>`;
  }
  html += "</tbody></table>";
  body.innerHTML = html;
}

function toggleNewForm(show) {
  const form = document.getElementById("newForm");
  const willShow = show === undefined ? !form.classList.contains("show") : show;
  form.classList.toggle("show", willShow);
  if (willShow) {
    document.getElementById("fDatumPrijeti").valueAsDate = new Date();
    document.getElementById("fServisniPartner").focus();
  }
}

async function createReklamace() {
  const servisni_partner = document.getElementById("fServisniPartner").value.trim();
  const kontaktni_osoba = document.getElementById("fKontaktniOsoba").value.trim();
  const datum_prijeti = document.getElementById("fDatumPrijeti").value;
  const err = document.getElementById("formError");
  err.style.display = "none";

  if (!servisni_partner || !datum_prijeti) {
    err.textContent = "Vyplňte servisního partnera a datum přijetí.";
    err.style.display = "block";
    return;
  }

  try {
    const resp = await fetch("/api/reklamace", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ znacka: BRAND, servisni_partner, kontaktni_osoba, datum_prijeti }),
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.message || "Chyba při ukládání.");
    location.href = `/${BRAND}/reklamace/${data.cislo}`;
  } catch (e) {
    err.textContent = e.message;
    err.style.display = "block";
  }
}

function exportXlsx() {
  window.location.href = `/api/reklamace/export?znacka=${BRAND}`;
}

function showToast(msg, isError = false) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast show" + (isError ? " error" : "");
  setTimeout(() => { t.className = "toast"; }, 3000);
}

loadNastaveni().then(loadList);
</script>
</body>
</html>
