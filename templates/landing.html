<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reklamace — výběr značky</title>
<style>
  :root { --blue: #1F4E79; --text: #1a1a2e; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    color: var(--text); background: #eef2f7;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 28px;
  }
  h1 { font-size: 20px; color: var(--blue); margin: 0 0 4px; }
  .cards { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
  .card {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    width: 240px; height: 170px; border-radius: 14px; background: #fff;
    box-shadow: 0 2px 10px rgba(0,0,0,.12); text-decoration: none; color: var(--blue);
    border: 2px solid transparent; transition: transform .12s, box-shadow .12s, border-color .12s;
    padding: 20px;
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 6px 18px rgba(0,0,0,.18); border-color: #2E75B6; }
  .card img { max-width: 100%; max-height: 110px; object-fit: contain; }
</style>
</head>
<body>
  <h1>🛠️ Správa reklamací — vyberte značku</h1>
  <div class="cards">
    {% for key, b in brands.items() %}
    <a class="card" href="/{{ key }}">
      <img src="{{ url_for('static', filename='logos/' + b.logo) }}" alt="{{ b.label }}">
    </a>
    {% endfor %}
  </div>
</body>
</html>
